<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Lịch sử dữ liệu</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>

<div class="container">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-leaf"></i>

            Smart <span>IoT</span>

        </div>


        <nav class="menu">

            <a href="index.html">

                <i class="fa-solid fa-house"></i>

                <span>Tổng quan</span>

            </a>


            <a href="dashboard.html">

                <i class="fa-solid fa-chart-line"></i>

                <span>Giám sát</span>

            </a>


            <a class="active"
               href="history.html">

                <i class="fa-solid fa-clock-rotate-left"></i>

                <span>Lịch sử</span>

            </a>

        </nav>


        <div class="device-box">

            <h3>Thiết bị ESP32-C3</h3>

            <p id="historyDeviceStatus">

                <i class="fa-solid fa-circle"></i>

                ESP32 Ngoại tuyến

            </p>

            <p>
                Cảm biến AHT30
            </p>

            <small id="historyLastSeen">
                Chưa nhận dữ liệu
            </small>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="main-content">


            <!-- HEADER -->

            <header class="header">

                <div>

                    <h1>
                        Lịch sử dữ liệu
                    </h1>

                    <p>
                        Dữ liệu môi trường trong 30 ngày gần nhất
                    </p>

                </div>


                <div class="status">

                    30 ngày gần nhất

                </div>

            </header>


            <!-- CHART -->

            <section class="panel history-chart-panel">

                <div class="panel-title">

                    <i class="fa-solid fa-chart-line"></i>

                    Xu hướng nhiệt độ và độ ẩm

                </div>


                <div class="history-chart-container">

                    <canvas id="historyChart"></canvas>

                </div>

            </section>


            <!-- TABLE -->

            <section class="panel history-table-panel">

                <div class="panel-title">

                    <i class="fa-solid fa-table"></i>

                    Bảng dữ liệu lịch sử

                </div>


                <div class="history-table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Ngày
                                </th>

                                <th>
                                    Nhiệt độ trung bình
                                </th>

                                <th>
                                    Độ ẩm trung bình
                                </th>

                            </tr>

                        </thead>


                        <tbody id="historyTable"></tbody>

                    </table>

                </div>

            </section>


        </div>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
